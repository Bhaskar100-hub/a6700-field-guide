<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Offline field guide for Sony a6700 + Sigma 16-300: scene presets, button diagrams, menu paths, calculators.">
<title>a6700 Field Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #0d0f13; --surf: #161a21; --surf2: #1e232c; --line: #2a303b; --text: #eceff4; --muted: #9aa4b4;
  --acc: #ffb020; --acc-ink: #1a1200; --acc2: #49b6ff; --ok: #3ddc84; --warn: #ff6b5b;
  --cam-body: #232831; --cam-line: #4a5262; --cam-btn: #343b47; --cam-dark: #0b0d10; --cam-metal: #59616f; --cam-glass: #1b2a3a;
  --r: 14px; --nav-h: 64px;
  color-scheme: dark;
}
:root[data-theme="sun"] {
  --bg: #ffffff; --surf: #f2f4f7; --surf2: #e6e9ee; --line: #c9ced6; --text: #0a0c10; --muted: #444c58;
  --acc: #c26a00; --acc-ink: #ffffff; --acc2: #0067c5; --ok: #0a8a3c; --warn: #c4291c;
  --cam-body: #d9dde3; --cam-line: #6a7282; --cam-btn: #b9c0ca; --cam-dark: #2a2f37; --cam-metal: #9aa2ae; --cam-glass: #5a7da0;
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg: #000; --surf: #0e0000; --surf2: #180000; --line: #3a0606; --text: #ff3b30; --muted: #a8211a;
  --acc: #ff2a1f; --acc-ink: #000; --acc2: #d42a20; --ok: #ff3b30; --warn: #ff6a5f;
  --cam-body: #160000; --cam-line: #6a0d08; --cam-btn: #2a0303; --cam-dark: #000; --cam-metal: #3e0705; --cam-glass: #120000;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }
a { color: var(--acc2); }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 1.35rem; } h2 { font-size: 1.12rem; } h3 { font-size: 1rem; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .back { border: 0; background: var(--surf2); border-radius: 10px; width: 40px; height: 40px; font-size: 1.2rem; }
.top .ttl { flex: 1; font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.themebtn { border: 1px solid var(--line); background: var(--surf); border-radius: 10px; height: 40px; padding: 0 10px; font-size: .85rem; }
main { padding: 14px 16px 24px; max-width: 760px; margin: 0 auto; }

/* bottom nav */
nav.bn { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surf); border-top: 1px solid var(--line); }
nav.bn a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: .72rem; }
nav.bn a .i { font-size: 1.35rem; line-height: 1; }
nav.bn a.on { color: var(--acc); font-weight: 700; }

/* cards & lists */
.card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin: 0 0 12px; }
.card.hero { background: linear-gradient(135deg, color-mix(in srgb, var(--acc) 22%, var(--surf)), var(--surf)); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile { display: flex; flex-direction: column; gap: 6px; min-height: 92px; padding: 12px; border-radius: var(--r); background: var(--surf); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
.tile .e { font-size: 1.6rem; line-height: 1; } .tile b { font-size: .95rem; } .tile small { color: var(--muted); font-size: .78rem; }
.tile.star { border-color: color-mix(in srgb, var(--acc) 60%, var(--line)); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surf); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; text-decoration: none; color: var(--text); }
.row .e { font-size: 1.4rem; width: 32px; text-align: center; flex: none; }
.row .tx { flex: 1; min-width: 0; } .row .tx small { display: block; color: var(--muted); font-size: .8rem; }
.row .chev { color: var(--muted); }
.sec { margin: 18px 0 8px; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 99px; background: var(--surf2); border: 1px solid var(--line); font-size: .78rem; margin: 2px 4px 2px 0; }
.pill.acc { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 700; }
.warnbox { border-left: 4px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--surf)); padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: .9rem; }
.tipbox { border-left: 4px solid var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surf)); padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: .9rem; }
ul.clean { margin: 6px 0; padding-left: 20px; } ul.clean li { margin: 4px 0; }

/* search */
.search { display: flex; gap: 8px; margin-bottom: 14px; }
.search input, input.f, select.f, textarea.f { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surf); color: var(--text); font: inherit; }
textarea.f { height: auto; min-height: 70px; padding: 10px 14px; width: 100%; }
.btn { border: 0; height: 48px; padding: 0 16px; border-radius: 12px; background: var(--acc); color: var(--acc-ink); font-weight: 700; cursor: pointer; }
.btn.ghost { background: var(--surf2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
.btn.sm { height: 38px; padding: 0 12px; font-size: .9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.chip { border: 1px solid var(--line); background: var(--surf); color: var(--text); padding: 7px 12px; border-radius: 99px; font-size: .85rem; cursor: pointer; }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); font-weight: 700; }

/* preset settings table */
.set { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
.set details { border-bottom: 1px solid var(--line); background: var(--surf); }
.set details:last-child { border-bottom: 0; }
.set summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; padding: 11px 12px; cursor: pointer; }
.set summary::-webkit-details-marker { display: none; }
.set summary .k { color: var(--muted); font-size: .86rem; }
.set summary .v { font-weight: 700; font-size: .92rem; }
.set summary .v::after { content: " ›"; color: var(--muted); font-weight: 400; }
.set details[open] summary .v::after { content: " ⌄"; }
.set .more { padding: 0 12px 12px; font-size: .9rem; }
.path { font-size: .82rem; color: var(--acc); font-weight: 600; margin: 4px 0; word-break: break-word; }

/* steps */
ol.steps { list-style: none; counter-reset: s; padding: 0; margin: 0 0 12px; }
ol.steps > li { counter-increment: s; position: relative; padding: 12px 12px 12px 50px; background: var(--surf); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
ol.steps > li::before { content: counter(s); position: absolute; left: 12px; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: var(--acc-ink); font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
ol.steps > li.done { opacity: .55; } ol.steps > li.done::before { content: "✓"; background: var(--ok); }
.stepbtns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

/* camera svg */
.camwrap { background: var(--surf2); border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin: 8px 0; }
.camtabs { display: flex; gap: 6px; margin-bottom: 6px; }
svg.cam { width: 100%; height: auto; display: block; }
svg.cam .body { fill: var(--cam-body); stroke: var(--cam-line); stroke-width: 1.5; }
svg.cam .dark { fill: var(--cam-dark); stroke: var(--cam-line); }
svg.cam .glass { fill: var(--cam-glass); }
svg.cam .btn { fill: var(--cam-btn); stroke: var(--cam-line); stroke-width: 1.2; }
svg.cam .btn.red { stroke: #d33; stroke-width: 2; }
svg.cam .metal { fill: var(--cam-metal); stroke: var(--cam-line); }
svg.cam .dial, svg.cam .ring, svg.cam .wheel, svg.cam .lens { fill: var(--cam-btn); stroke: var(--cam-line); stroke-width: 1.2; }
svg.cam .ring { fill: var(--cam-metal); }
svg.cam .screen { fill: var(--cam-dark); stroke: var(--cam-line); }
svg.cam .kn { stroke: var(--cam-line); stroke-width: 1; }
svg.cam .arr { fill: var(--muted); }
svg.cam .ico { fill: var(--text); }
svg.cam .idx { stroke: var(--acc); stroke-width: 4; }
svg.cam .turn { fill: none; stroke: var(--acc); stroke-width: 4; }
svg.cam .seg { fill: var(--cam-btn); stroke: var(--cam-line); }
svg.cam .seg.on { fill: var(--acc); }
svg.cam text { font: 600 10px system-ui, sans-serif; }
svg.cam .pl { fill: var(--muted); } svg.cam .pl.dim { font-weight: 400; font-size: 9px; }
svg.cam .pl.on { fill: var(--acc-ink); font-weight: 800; }
svg.cam .dm { fill: var(--text); font-size: 15px; font-weight: 800; } svg.cam .dm.on { fill: var(--acc); font-size: 19px; }
svg.cam .hl:not(text) { fill: var(--acc) !important; stroke: var(--acc) !important; animation: pulse 1.2s ease-in-out infinite; }
svg.cam text.hl { fill: var(--acc); font-weight: 900; font-size: 11px; }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { svg.cam .hl { animation: none; } }
.parts { font-size: .85rem; }

/* sony-style menu replica */
.menu { display: grid; grid-template-columns: 40px 30px minmax(0, 1fr); background: #000; color: #fff; border-radius: 10px; overflow: hidden; border: 2px solid #333; font-size: 12.5px; margin: 8px 0; }
:root[data-theme="night"] .menu { color: #ff3b30; border-color: #3a0606; }
.menu .hdr { grid-column: 1 / -1; display: flex; justify-content: space-between; padding: 6px 10px; background: #1a1a1a; border-bottom: 1px solid #333; font-weight: 700; }
:root[data-theme="night"] .menu .hdr { background: #120000; }
.menu .tabs { display: flex; flex-direction: column; background: #111; border-right: 1px solid #333; }
.menu .tabs span { height: 30px; display: grid; place-items: center; opacity: .55; border-left: 3px solid transparent; }
.menu .tabs span svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.menu .tabs span.on { opacity: 1; background: #2b2b2b; border-left-color: var(--acc); }
.menu .grp { display: flex; flex-direction: column; background: #0a0a0a; border-right: 1px solid #333; }
.menu .grp span { height: 24px; display: grid; place-items: center; opacity: .5; font-weight: 700; font-size: 11px; }
.menu .grp span.on { opacity: 1; background: var(--acc); color: #000; }
.menu .items { padding: 4px 0; min-width: 0; }
.menu .items div { padding: 4px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.menu .items div.on { opacity: 1; background: #fff; color: #000; font-weight: 700; border-radius: 3px; margin: 0 4px; }
:root[data-theme="night"] .menu .items div.on { background: #ff3b30; }
.menu .items div i { font-style: normal; font-size: 10px; opacity: .8; margin-left: 4px; }
.menu .ft { grid-column: 1 / -1; padding: 4px 10px; border-top: 1px solid #333; font-size: 10.5px; opacity: .7; }

/* ask / chat */
.chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.bub { max-width: 92%; padding: 10px 12px; border-radius: 14px; }
.bub.me { align-self: flex-end; background: var(--acc); color: var(--acc-ink); border-bottom-right-radius: 4px; }
.bub.bot { align-self: flex-start; background: var(--surf); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bub.bot .also a { display: block; padding: 6px 0; }
.askbar { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 6px); display: flex; gap: 8px; background: var(--bg); padding: 6px 0; }

/* step-by-step overlay */
.ovl { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.ovl .body { flex: 1; overflow: auto; padding: 16px; max-width: 760px; margin: 0 auto; width: 100%; }
.ovl .bar { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surf); }
.ovl .bar .btn { flex: 1; }
.ovl .big { font-size: 1.25rem; font-weight: 700; margin: 10px 0; }
.prog { height: 4px; background: var(--surf2); } .prog i { display: block; height: 100%; background: var(--acc); }

/* checklist */
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 12px; background: var(--surf); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; margin-top: 1px; }
.chk.done span { text-decoration: line-through; color: var(--muted); }

/* forms */
label.fl { display: block; font-size: .82rem; color: var(--muted); margin: 10px 0 4px; }
.calcout { font-size: 1.05rem; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--surf2); }
.calcout b { color: var(--acc); font-size: 1.25rem; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.two .f, label.fl + .f, .card > .f { width: 100%; }
input[type=date].f { width: 100%; min-width: 0; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: .92rem; }
.kv b, .calcout .kv b { color: var(--acc); font-size: .95rem; }
a.chip { text-decoration: none; display: inline-block; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; z-index: 60; font-weight: 600; }
.hidden { display: none !important; }

</style>
</head>

    play: 'Playback — view your photos and videos.', c3: 'Custom button 3 while shooting · Delete 🗑 in playback.',
    monitor: 'Vari-angle touch screen — flips out to the side and rotates forward for vlogging.', evf: 'Electronic viewfinder — better in bright sun, saves battery.',
    diopter: 'Turn until the viewfinder text is sharp for your eye.', lensZoom: 'Zoom 16–300 mm (24–450 mm full-frame equivalent).',
    lensFocus: 'Manual focus ring (focus-by-wire).', zoomLock: 'Locks the lens at 16 mm so it doesn’t extend while walking.', filter: 'Front thread: 67 mm — your K&F VND/CPL screws on here.'
  };
  V.camera = (arg) => {
    const view = arg || 'rear', sel = S.get('camsel', null);
    const ids = { rear: ['menu', 'modeDial', 'smsDial', 'rearDial', 'afon', 'c1', 'fn', 'wUp', 'wRight', 'wDown', 'wLeft', 'wCenter', 'play', 'c3', 'monitor', 'evf', 'diopter'], top: ['shutter', 'power', 'frontDial', 'c2', 'movie', 'shoe', 'menu', 'modeDial', 'smsDial', 'rearDial', 'lensZoom', 'lensFocus', 'zoomLock', 'filter'], wheel: ['wUp', 'wRight', 'wDown', 'wLeft', 'wCenter', 'wTurn'], dial: [] }[view] || [];
    const on = sel && ids.includes(sel) ? [sel] : [];
    const svg = view === 'top' ? Diagrams.top(on) : view === 'wheel' ? Diagrams.wheel(on) : view === 'dial' ? Diagrams.modeDial(S.get('dialsel', 'A'), S.get('smssel', 'Still')) + Diagrams.fnGrid() : Diagrams.rear(on);
    return frame('Buttons map', `
      <div class="chips">${[['rear', 'Back'], ['top', 'Top'], ['wheel', 'Control wheel'], ['dial', 'Dials & Fn']].map(([v, l]) => `<a class="chip ${v === view ? 'on' : ''}" href="#camera/${v}">${l}</a>`).join('')}</div>
      <div class="camwrap">${svg}</div>
      ${view === 'dial' ? `<div class="chips">${Diagrams.MODES.map(m => `<button class="chip ${S.get('dialsel', 'A') === m ? 'on' : ''}" data-act="dialsel" data-v="${m}">${m}</button>`).join('')}</div>
        <div class="chips">${['Still', 'Movie', 'S&Q'].map(m => `<button class="chip ${S.get('smssel', 'Still') === m ? 'on' : ''}" data-act="smssel" data-v="${m}">${m}</button>`).join('')}</div>
        <div class="card small"><b>Mode dial:</b> ${esc(PARTINFO.modeDial)}<br><b>Still/Movie/S&Q:</b> ${esc(PARTINFO.smsDial)}<br><b>Fn menu:</b> ${esc(PARTINFO.fn)}</div>` :
        `<div class="sec">Tap a part</div><div class="chips">${ids.map(i => `<button class="chip ${sel === i ? 'on' : ''}" data-act="camsel" data-v="${i}">${esc((PARTS[i] || [i])[0].split(' (')[0])}</button>`).join('')}</div>
        ${on.length ? `<div class="card"><b>${esc(PARTS[sel][0])}</b><p class="small" style="margin:.4em 0 0">${esc(PARTINFO[sel] || '')}</p></div>` : ''}`}
      <p class="small muted">Illustration drawn from Sony's official “Names of parts” diagrams for the ILCE-6700 — positions match, shapes simplified.</p>`);
  };

  /* Menu explorer */
  V.menu = (arg) => {
    const [ti0, gi0] = (arg || '2/0').split('/').map(Number);
    const ti = Math.min(ti0 || 0, MENU.length - 1), gi = Math.min(gi0 || 0, MENU[ti].groups.length - 1);
    const tab = MENU[ti], grp = tab.groups[gi];
    const refs = it => [...KB.presets.flatMap(p => (p.set || []).filter(r => r.p && r.p[2] === it && r.p[0] === tab.tab).map(() => ['p/' + p.id, p.title])), ...KB.howto.filter(h => (h.steps || []).some(s => s.p && s.p[2] === it && s.p[0] === tab.tab)).map(h => ['h/' + h.id, h.title])];
    return frame('Menu explorer', `
      <form class="search" data-act="menusearch"><input name="q" placeholder="Find a menu item (e.g. zebra)" autocomplete="off"><button class="btn">Find</button></form>
      <div id="menures"></div>
      <div class="chips">${MENU.map((t, i) => `<a class="chip ${i === ti ? 'on' : ''}" href="#menu/${i}/0">${esc(t.tab)}</a>`).join('')}</div>
      <div class="chips">${tab.groups.map((g, i) => `<a class="chip ${i === gi ? 'on' : ''}" href="#menu/${ti}/${i}">${i + 1}. ${esc(g.g)}</a>`).join('')}</div>
      ${menuScreen([tab.tab, grp.g, grp.items[0]])}
      ${grp.items.map(it => { const r = refs(it); return `<div class="row"><span class="tx"><b>${esc(itemName(it))}</b> ${itemIcon(it)}<small>${pathText([tab.tab, grp.g, it])}</small>${r.length ? r.filter((x, i) => r.findIndex(y => y[0] === x[0]) === i).slice(0, 3).map(([h, t]) => `<a class="small" href="#${h}">→ ${esc(t)}</a>`).join(' · ') : ''}</span><button class="btn ghost sm" data-act="showmenu2" data-p='${esc(JSON.stringify([tab.tab, grp.g, it]))}'>☰</button></div>`; }).join('')}
      <p class="small muted">Tree transcribed from Sony's ILCE-6700 Help Guide “Finding functions from MENU”. Some items appear only in Still or Movie mode (📷/🎥).</p>`);
  };

  /* Checklists */
  V.checklists = () => frame('Checklists', KB.checklists.map(c => { const d = S.get('cl:' + c.id, []); return rowLink('cl/' + c.id, c.icon, c.title, `${d.length}/${c.items.length} done`); }).join(''));
  V.cl = (id) => {
    const c = KB.checklists.find(x => x.id === id); if (!c) return V.notfound();
    const d = S.get('cl:' + id, []);
    return frame(c.title, c.items.map((t, i) => `<label class="chk ${d.includes(i) ? 'done' : ''}"><input type="checkbox" data-act="cltick" data-k="${esc(id)}" data-i="${i}" ${d.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('') +
      `<button class="btn ghost" data-act="clreset" data-k="${esc(id)}">Reset list</button>`, { fav: 'cl/' + id });
  };

  /* Trip log & brief */
  V.trip = () => {
    const log = S.get('trip', []), br = S.get('brief', {});
    const hero = ['Wide', 'Detail', 'Person in scene', 'Movement to/away', '10 s ambient sound'];
    return frame('Trip log & edit brief', `
      <div class="card"><h2>➕ New entry</h2>
        <div class="two"><div><label class="fl">Date</label><input class="f" id="tr-d" type="date" value="${new Date().toISOString().slice(0, 10)}"></div>
        <div><label class="fl">Place</label><input class="f" id="tr-p" placeholder="e.g. Chandrashila"></div></div>
        <div class="stepbtns"><button class="btn ghost sm" data-act="trgps">📍 Add GPS</button><span class="small muted" id="tr-g"></span></div>
        <label class="fl">Hero shots captured</label><div class="chips">${hero.map(h => `<label class="chip"><input type="checkbox" class="tr-h" value="${esc(h)}"> ${esc(h)}</label>`).join('')}</div>
        <label class="fl">⭐ Best clips (numbers from camera, e.g. C0045, C0051) + why</label><textarea class="f" id="tr-good"></textarea>
        <label class="fl">✖ Rejected clips + why (shake, flare, mount in frame…)</label><textarea class="f" id="tr-bad"></textarea>
        <label class="fl">Notes (profile/WB used, light, story)</label><textarea class="f" id="tr-n"></textarea>
        <button class="btn" style="width:100%;margin-top:10px" data-act="trsave">Save entry</button></div>
      <div class="card"><h2>📝 5-line edit brief</h2>
        ${[['platform', 'Platform & aspect (e.g. Instagram 9:16)'], ['length', 'Target length (e.g. 35 s)'], ['ref', 'Reference (reel/link/description)'], ['mood', 'Mood / song'], ['vo', 'Voice-over? yes/no + language']].map(([k, l]) => `<label class="fl">${l}</label><input class="f" data-act="brief" data-k="${k}" value="${esc(br[k] || '')}">`).join('')}</div>
      <div class="stepbtns"><button class="btn" data-act="trexport">⬇ Export JSON for PC</button><label class="btn ghost" style="display:inline-flex;align-items:center">⬆ Import<input type="file" accept="application/json" data-act="trimport" class="hidden"></label></div>
      <div class="sec">Entries (${log.length})</div>
      ${log.slice().reverse().map((e, ri) => { const i = log.length - 1 - ri; return `<div class="card small"><b>${esc(e.date)} · ${esc(e.place || '—')}</b>${e.gps ? ` <span class="muted">📍${e.gps.la.toFixed(4)}, ${e.gps.lo.toFixed(4)}</span>` : ''}<br>
        ${(e.hero || []).map(h => `<span class="pill">✓ ${esc(h)}</span>`).join('')}
        ${e.good ? `<div>⭐ ${esc(e.good)}</div>` : ''}${e.bad ? `<div>✖ ${esc(e.bad)}</div>` : ''}${e.notes ? `<div class="muted">${esc(e.notes)}</div>` : ''}
        <button class="btn ghost sm" data-act="trdel" data-i="${i}" style="margin-top:6px">Delete</button></div>`; }).join('') || '<p class="muted">No entries yet.</p>'}
      <p class="small muted">Saved only on this phone. Export after each trip and copy the file to your PC (footage index / shot ledger).</p>`);
  };

  /* My camera */
  V.mycam = () => {
    const m = S.get('mycam', {});
    const F = [['fwBody', 'Body firmware', '2.00'], ['fwLens', 'Lens firmware', '01'], ['c1s', 'C1 (Still)'], ['c2s', 'C2 (Still)'], ['c3s', 'C3 (Still)'], ['c1m', 'C1 (Movie)'], ['c2m', 'C2 (Movie)'], ['c3m', 'C3 (Movie)'], ['afon', 'AF-ON'],
      ['s1', 'Still dial 1', 'Everyday Photo'], ['s2', 'Still dial 2', 'Milky Way'], ['s3', 'Still dial 3', 'Wildlife 300 mm'], ['m1', 'Movie dial 1', 'Everyday Video'], ['m2', 'Movie dial 2', 'Cinematic tripod'], ['m3', 'Movie dial 3', 'Low-light handheld']];
    return frame('My camera', `
      <div class="tipbox">Check your current buttons: MENU → Setup → Operation Customize → Custom Key/Dial Set. Write them here so you never forget.</div>
      <div class="card">${F.map(([k, l, ph]) => `<label class="fl">${esc(l)}</label><input class="f" data-act="mycam" data-k="${k}" value="${esc(m[k] != null ? m[k] : (k.startsWith('fw') ? ph : ''))}" placeholder="${esc(ph || 'function…')}">`).join('')}
      <label class="fl">Notes</label><textarea class="f" data-act="mycam" data-k="notes">${esc(m.notes || '')}</textarea></div>
      <div class="card small"><b>Your kit</b><br>Sony a6700 (ILCE-6700) · Sigma 16-300 mm F3.5-6.7 DC OS | C (67 mm, 615 g, zoom lock, splash-resistant) · Lexar 128 GB SDXC UHS-II V60 (OK for XAVC HS/S, not XAVC S-I) · K&F 67 mm VND2-32 + CPL · Tripod</div>`);
  };

  V.glossary = () => frame('Glossary', KB.glossary.map(([t, d], i) => `<div class="card" id="g${i}"><b>${esc(t)}</b><div class="small" style="margin-top:4px">${esc(d)}</div></div>`).join(''));

  V.about = () => frame('About & install', `
    <div class="card"><b>Wary's a6700 Field Guide v${APP_VERSION}</b><p class="small">Works 100% offline once installed. Content written for Sony a6700 (body fw 2.00), Sigma 16-300 F3.5-6.7 DC OS | C, Lexar 128 GB V60, K&F 67 mm VND/CPL.</p>
      <span class="pill ${navigator.onLine ? '' : 'acc'}">${navigator.onLine ? '🌐 Online now' : '✈ Offline'}</span><span class="pill">${'serviceWorker' in navigator && navigator.serviceWorker.controller ? '✅ Saved for offline' : '⏳ Not yet cached'}</span></div>
    <div class="card small"><b>Install on Samsung S24 Ultra (Chrome)</b><ol><li>Open the app link once with internet.</li><li>Chrome menu ⋮ → <b>Add to Home screen</b> → Install.</li><li>Turn on airplane mode and open it from the home screen to test.</li></ol></div>
    <div class="card small"><b>Accuracy</b><p>Button positions, menu tree, menu paths, card limits and recording times come from Sony's official ILCE-6700 Help Guide and Sigma's lens page. Items marked ⚠ are not confirmed there — check on your camera. Shooting values (e.g. ISO for stars) are starting points, not rules.</p></div>
    <div class="card small"><b>Settings</b><label class="chk"><input type="checkbox" data-act="autonight" ${S.get('autoNight', true) ? 'checked' : ''}><span>Switch to red night mode automatically on night presets</span></label></div>`);

  V.notfound = () => frame('Not found', '<p>That page does not exist.</p><a href="#home">Home</a>');

  /* ---------- step-by-step overlay ---------- */
  function stepMode(key, i = 0) {
    const it = ALL[key]; if (!it) return; const steps = it.steps || [];
    const s = steps[i]; let ov = $('.ovl'); if (!ov) { ov = document.createElement('div'); ov.className = 'ovl'; document.body.appendChild(ov); }
    ov.innerHTML = `<div class="prog"><i style="width:${(i + 1) / steps.length * 100}%"></i></div>
      <div class="body"><div class="muted small">${esc(it.title)} · step ${i + 1} of ${steps.length}</div><div class="big">${esc(s.t)}</div>
      ${s.b ? diag([s.b]) : ''}${s.p ? menuScreen(s.p) : ''}</div>
      <div class="bar"><button class="btn ghost" data-act="ovclose">✕</button><button class="btn ghost" data-act="ovgo" data-k="${esc(key)}" data-i="${i - 1}" ${i === 0 ? 'disabled' : ''}>‹ Back</button>
      ${i < steps.length - 1 ? `<button class="btn" data-act="ovgo" data-k="${esc(key)}" data-i="${i + 1}">Next ›</button>` : '<button class="btn" data-act="ovclose">Done ✓</button>'}</div>`;
  }

  /* ---------- router ---------- */
  function currentRoute() { return decodeURIComponent(location.hash.slice(1).split('?')[0]) || 'home'; }
  function render() {
    const r = currentRoute(); const [head, ...rest] = r.split('/'); const arg = rest.join('/');
    const fn = V[head] || V.notfound;
    $('#app').innerHTML = fn(arg);
    const ov = $('.ovl'); if (ov) ov.remove();
    window.scrollTo(0, 0);
    if (head === 'tools' && arg) runTool();
    if (head === 'ask') { const c = $('.chat'); if (c && CHAT.length) { const last = c.lastElementChild; last && last.scrollIntoView({ block: 'start' }); } }
  }
  window.addEventListener('hashchange', render);

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
    if (a === 'back') { history.length > 1 ? history.back() : (location.hash = 'home'); }
    else if (a === 'theme') { const t = S.get('theme', 'dark'); setTheme(THEMES[(THEMES.indexOf(t) + 1) % 3]); }
    else if (a === 'fav') { const k = el.dataset.k; let f = S.get('favs', []); f = f.includes(k) ? f.filter(x => x !== k) : [k, ...f]; S.set('favs', f); el.textContent = f.includes(k) ? '★' : '☆'; toast(f.includes(k) ? 'Added to favourites' : 'Removed'); }
    else if (a === 'diagview') { const w = el.closest('[data-diag]'); w.outerHTML = diag(el.dataset.ids ? el.dataset.ids.split(',') : [], el.dataset.v); }
    else if (a === 'showbtn' || a === 'showmenu') {
      e.stopPropagation(); const box = el.closest('li').querySelector('.stepx');
      const html = a === 'showbtn' ? diag([el.dataset.b]) : menuScreen(JSON.parse(el.dataset.p));
      box.innerHTML = box.dataset.cur === a ? '' : html; box.dataset.cur = box.dataset.cur === a ? '' : a;
    }
    else if (a === 'showmenu2') { const row = el.closest('.row'); const n = row.nextElementSibling; if (n && n.classList.contains('menuinline')) n.remove(); else row.insertAdjacentHTML('afterend', `<div class="menuinline">${menuScreen(JSON.parse(el.dataset.p))}</div>`); }
    else if (a === 'stepdone') { if (e.target.closest('button,a,.menu,.camwrap')) return; const k = el.dataset.k, i = +el.dataset.i; let d = S.get('done:' + k, []); d = d.includes(i) ? d.filter(x => x !== i) : [...d, i]; S.set('done:' + k, d); el.classList.toggle('done'); }
    else if (a === 'stepmode') stepMode(el.dataset.k, 0);
    else if (a === 'ovgo') stepMode(el.dataset.k, +el.dataset.i);
    else if (a === 'ovclose') { const o = $('.ovl'); o && o.remove(); }
    else if (a === 'askchip') { askNow(el.textContent); }
    else if (a === 'clearchat') { CHAT = []; render(); }
    else if (a === 'starset') { $('#st-f').value = el.dataset.v; $('#st-n').value = ''; runTool(); }
    else if (a === 'place') { $('#sn-la').value = el.dataset.la; $('#sn-lo').value = el.dataset.lo; runTool(); }
    else if (a === 'gps' || a === 'trgps') {
      if (!navigator.geolocation) return toast('GPS not available');
      toast('Getting GPS…');
      navigator.geolocation.getCurrentPosition(p => {
        const la = +p.coords.latitude.toFixed(4), lo = +p.coords.longitude.toFixed(4);
        if (a === 'gps') { $('#sn-la').value = la; $('#sn-lo').value = lo; runTool(); }
        else { window._trgps = { la, lo }; $('#tr-g').textContent = `📍 ${la}, ${lo}`; }
      }, err => toast('GPS: ' + err.message), { enableHighAccuracy: true, timeout: 30000, maximumAge: 600000 });
    }
    else if (a === 'camsel') { S.set('camsel', el.dataset.v); render(); }
    else if (a === 'dialsel') { S.set('dialsel', el.dataset.v); render(); }
    else if (a === 'smssel') { S.set('smssel', el.dataset.v); render(); }
    else if (a === 'clreset') { S.set('cl:' + el.dataset.k, []); render(); }
    else if (a === 'trsave') {
      const log = S.get('trip', []);
      log.push({ date: $('#tr-d').value, place: $('#tr-p').value.trim(), gps: window._trgps || null, hero: [...document.querySelectorAll('.tr-h:checked')].map(x => x.value), good: $('#tr-good').value.trim(), bad: $('#tr-bad').value.trim(), notes: $('#tr-n').value.trim(), saved: new Date().toISOString() });
      S.set('trip', log); window._trgps = null; toast('Saved'); render();
    }
    else if (a === 'trdel') { if (!confirm('Delete this entry?')) return; const log = S.get('trip', []); log.splice(+el.dataset.i, 1); S.set('trip', log); render(); }
    else if (a === 'trexport') {
      const data = { app: 'wary-a6700-field-guide', version: APP_VERSION, exported: new Date().toISOString(), trip: S.get('trip', []), brief: S.get('brief', {}), mycam: S.get('mycam', {}) };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const name = `a6700-triplog-${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([blob], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: name }).catch(() => { });
      else { const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
    }
  });
  document.addEventListener('change', e => {
    const el = e.target; const a = el.dataset.act;
    if (a === 'cltick') { const k = el.dataset.k, i = +el.dataset.i; let d = S.get('cl:' + k, []); d = el.checked ? [...new Set([...d, i])] : d.filter(x => x !== i); S.set('cl:' + k, d); el.closest('.chk').classList.toggle('done', el.checked); }
    else if (a === 'autonight') S.set('autoNight', el.checked);
    else if (a === 'trimport') {
      const f = el.files[0]; if (!f) return; f.text().then(t => { const d = JSON.parse(t); if (d.trip) S.set('trip', d.trip); if (d.brief) S.set('brief', d.brief); if (d.mycam) S.set('mycam', d.mycam); toast('Imported'); render(); }).catch(() => toast('Not a valid file'));
    }
  });
  document.addEventListener('input', e => {
    const el = e.target; const a = el.dataset.act;
    if (['starcalc', 'cardcalc', 'tlcalc', 'ndcalc', 'pbcalc', 'suncalc'].includes(a)) runTool();
    else if (a === 'brief') { const b = S.get('brief', {}); b[el.dataset.k] = el.value; S.set('brief', b); }
    else if (a === 'mycam') { const m = S.get('mycam', {}); m[el.dataset.k] = el.value; S.set('mycam', m); }
  });
  document.addEventListener('toggle', e => {
    const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.open) return;
    const m = d.querySelector('.more[data-lazy]'); if (!m || m.dataset.done) return;
    const o = JSON.parse(m.dataset.lazy); m.dataset.done = 1;
    m.innerHTML = `${o.w ? `<p style="margin:.2em 0 .5em">${esc(o.w)}</p>` : ''}${o.p ? `<div class="path">${pathText(o.p)}</div>${menuScreen(o.p)}` : ''}${o.b ? diag([o.b]) : ''}`;
  }, true);
  document.addEventListener('submit', e => {
    const f = e.target; const a = f.dataset.act; if (!a) return; e.preventDefault();
    const q = (new FormData(f).get('q') || '').toString().trim(); if (!q) return;
    if (a === 'asksubmit') askNow(q);
    else if (a === 'menusearch') {
      const t = q.toLowerCase(), hits = [];
      MENU.forEach(tab => tab.groups.forEach(g => g.items.forEach(it => { if ((itemName(it) + ' ' + g.g).toLowerCase().includes(t)) hits.push([tab.tab, g.g, it]); })));
      $('#menures').innerHTML = hits.length ? hits.slice(0, 8).map(p => `<div class="card small"><div class="path">${pathText(p)}</div>${menuScreen(p)}</div>`).join('') : '<p class="muted">No menu item matches.</p>';
    }
  });
  function askNow(q) { CHAT.push({ q, a: answerHTML(q) }); if (currentRoute() !== 'ask') location.hash = 'ask'; else render(); }

  /* ---------- boot ---------- */
  setTheme(S.get('theme', 'dark'));
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
  window.__app = { menuScreen, findPath, render, APP_VERSION };
})();

</script>
</body>
</html>
